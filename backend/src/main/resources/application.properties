spring.application.name=api
spring.profiles.active=dev

# Database Config
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true

# Minio Config
minio.server.access-key=minioadmin
minio.server.secret-key=minioadmin

server.servlet.contextPath=/api

# Custom properties
filehub.kc.realm=FileHub
filehub.kc.roles.admin=filehub_admin
filehub.kc.roles.user=filehub_user
filehub.kc.client.id=filehub-rest-api
filehub.kc.client.name=client_filehub_api

# Keycloak properties
keycloak.realm=FileHub
keycloak.client-id=filehub-rest-api
keycloak.client-secret=G9GNOxjksVgd0cQ5PinHKaWeiJYUwcVY
keycloak.public-client=false

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB
